[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-encrypted-temp"
version = "0.1.0"
description = "Experimental ephemeral encrypted filesystem for Codex temporary files"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=44,<47",
    "winfspy==0.8.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
codex-encrypted-temp = "codex_encrypted_temp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
